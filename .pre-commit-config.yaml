# Local hooks reuse the project's own toolchain via uv — no version drift
# between pre-commit, CI (.github/workflows/ci.yml) and dev commands.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --project apps/api ruff check --fix --force-exclude
        language: system
        types: [python]
        files: ^apps/api/
      - id: ruff-format
        name: ruff format
        entry: uv run --project apps/api ruff format --force-exclude
        language: system
        types: [python]
        files: ^apps/api/
      - id: mypy
        name: mypy
        entry: bash -c 'cd apps/api && uv run mypy src tests'
        language: system
        types: [python]
        files: ^apps/api/
        pass_filenames: false
