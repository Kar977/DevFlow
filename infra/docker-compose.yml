services:
  api:
    build:
      context: ../apps/api
    env_file:
      - ../apps/api/.env
    environment:
      DEVFLOW_API_ENVIRONMENT: local
      DEVFLOW_API_DEBUG: "true"
      DEVFLOW_API_DATABASE_URL: postgresql+asyncpg://devflow:devflow@postgres:5432/devflow
      DEVFLOW_API_REDIS_URL: redis://redis:6379/0
      DEVFLOW_API_CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
      # This branch (`demo`) exists to *be* the read-only showcase — see
      # docs/demo.md — so the local compose stack defaults to demo mode too.
      # Truncates and reseeds the database on every `up`/restart.
      DEVFLOW_API_DEMO_MODE: "true"
      DEVFLOW_API_ACCESS_TOKEN_EXPIRE_MINUTES: "720"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_DB: devflow
      POSTGRES_USER: devflow
      POSTGRES_PASSWORD: devflow
    ports:
      - "5432:5432"
    volumes:
      - devflow-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devflow -d devflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  devflow-postgres-data:
