[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "devflow-api"
version = "0.1.0"
description = "FastAPI backend for DevFlow Insight."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.15",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "pydantic-settings>=2.8",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/devflow_api"]

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",
    "B",
    "C4",
    "E",
    "F",
    "I",
    "N",
    "UP",
    "W",
]
ignore = [
    "B008",
]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
strict = true
mypy_path = "src"
warn_unused_ignores = true
warn_return_any = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
